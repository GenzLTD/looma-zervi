# ============================================================================
# 摘块预演配置（HTTP-only）— 对应 Cloudflare Flexible 回源 :80
# ============================================================================
#
# 用途：在本地证明「摘掉 nginx 里 genz.ltd / www.genz.ltd 的 server 块」不会
#       切掉 api webhook、也不会误伤 tspace。
#
# 形态：从 docker/nginx.conf 的 **HTTP(:80) 段**派生，去掉全部 443 / ssl_*，
#       裸域块刻意不存在（这正是被测对象）。
#
# 占位符由 run-test.sh / run-test.ps1 渲染，不要手改 .generated/ 下的产物。
#   __WORK__          运行时工作目录（放 pid / error.log / 生成的 mime.types）
#   __LISTEN__        监听端口（预演用 18080；真机是 80）
#   __UPSTREAM__      backend 地址（预演用 127.0.0.1:15200 stub；真机 127.0.0.1:5200）
#   __MIME_TYPES__    由 runner 生成的最小 mime.types 路径
#   __TSPACE_ROOT__   tspace 静态根（预演指向装置内 stub 目录）
#
# ⚠️ 漂移约束：本文件的 server_name 集合必须与 docker/nginx.conf 的 HTTP 段一致。
#    runner 会断言这一点；改 docker/nginx.conf 后若忘了同步这里，门禁会失败。
# ============================================================================

pid __WORK__/nginx.pid;
error_log __WORK__/error.log warn;

events {
    worker_connections 256;
}

http {
    include __MIME_TYPES__;
    default_type application/octet-stream;

    server_tokens off;
    access_log off;

    # 真配置指向 Flask :5200（Docker 端口映射到宿主）；预演指向 stub。
    upstream looma_backend {
        server __UPSTREAM__;
    }

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=2r/s;

    # ------------------------------------------------------------------------
    # api.genz.ltd — API only (no static SPA fallback)
    # ------------------------------------------------------------------------
    server {
        listen __LISTEN__;
        server_name api.genz.ltd;

        location /v1/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://looma_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /v1/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://looma_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_read_timeout 120s;
        }

        location /health {
            proxy_pass http://looma_backend/health;
            access_log off;
        }

        location / {
            default_type application/json;
            return 404 '{"error":"not_found","message":"Use /v1/ endpoints"}';
        }
    }

    # ------------------------------------------------------------------------
    # tspace.genz.ltd — B2B SPA + API proxy
    # ------------------------------------------------------------------------
    server {
        listen __LISTEN__;
        server_name tspace.genz.ltd;

        location /v1/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://looma_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            root __TSPACE_ROOT__;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }

    # ------------------------------------------------------------------------
    # Catch-all — 裸域块摘除后，genz.ltd / www.genz.ltd 应落在这里
    # 期望：404 Unknown host（而不是营销页 200）
    # ------------------------------------------------------------------------
    server {
        listen __LISTEN__ default_server;
        server_name _;

        location / {
            default_type application/json;
            return 404 '{"error":"not_found","message":"Unknown host"}';
        }
    }
}
