name: looma-zervi

services:
  # ============================================
  # Looma Backend (Flask)
  # 镜像首次手动 docker compose build，后续 CI 只重启容器加载新代码
  # ============================================
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: looma-backend
    restart: unless-stopped
    ports:
      - "5200:5200"
    environment:
      - FLASK_PORT=5200
      # Explicit CORS for SaaS hosts (also set via backend/.env; keep both in sync)
      - CORS_ORIGINS=${CORS_ORIGINS:-https://genz.ltd,https://www.genz.ltd,https://tspace.genz.ltd,https://api.genz.ltd,https://app.genz.ltd,https://tspace.szbolent.cn,http://localhost:5173,http://localhost:5174,http://localhost:3000}
      # Overseas: Google OAuth + payment providers + rate limiting
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-}
      # Stripe keys live in backend/.env (env_file). Do NOT list them under
      # environment: — compose interpolation of empty host vars would override
      # env_file with blank and silently disable overseas checkout.
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID:-}
      - PAYPAL_CLIENT_SECRET=${PAYPAL_CLIENT_SECRET:-}
      - PAYPAL_MODE=${PAYPAL_MODE:-sandbox}
      - PAYPAL_WEBHOOK_ID=${PAYPAL_WEBHOOK_ID:-}
      - AIRWALLEX_API_KEY=${AIRWALLEX_API_KEY:-}
      - AIRWALLEX_CLIENT_KEY=${AIRWALLEX_CLIENT_KEY:-}
      - AIRWALLEX_MODE=${AIRWALLEX_MODE:-demo}
      - AIRWALLEX_WEBHOOK_SECRET=${AIRWALLEX_WEBHOOK_SECRET:-}
      - RATE_LIMIT_STORAGE_URI=${RATE_LIMIT_STORAGE_URI:-memory://}
      # 计费部署位。缺省 CN：境内机不配此键时正确回落 CNY/微信路径
      # （DEPLOY_ALIASES 未收录 CN，等价于未设置）。海外机（Vultr）必须在
      # docker/.env 或 shell 显式钉 DEPLOY_REGION=SG——deploy-overseas.yml
      # 退役后不再有 workflow 兜底 export（2026-09-19 修复境内机自称海外站缺陷）。
      - DEPLOY_REGION=${DEPLOY_REGION:-CN}
      # QCC (企查查官方 MCP；2026-08-27 迁入 base，防 full.yml 重新生成丢配置。
      # 注意：compose environment 优先于 backend/.env，重新生成 full.yml 前
      # 必须确保插值源（docker/.env 或 shell）已配 QCC_ENABLED=true + QCC_AUTH_TOKEN)
      - QCC_ENABLED=${QCC_ENABLED:-false}
      - QCC_AUTH_TOKEN=${QCC_AUTH_TOKEN:-}
    env_file:
      - ../backend/.env
    volumes:
      # 代码 bind mount：rsync 后 restart 即生效，不需 rebuild
      - ../backend:/app
      - backend-data:/app/data
      - chroma-data:/app/chroma_data
      # 本地诗词向量库（宿主机 data/poetry_full → 容器内 /app/poetry_data）
      - ../data/poetry_full:/app/poetry_data:ro
      - ../data/chroma_models:/root/.cache/chroma/onnx_models
    depends_on:
      - redis
    networks:
      - looma-net

  # ============================================
  # ChromaDB (Vector Database)
  # ============================================
  chromadb:
    image: chromadb/chroma:latest
    container_name: looma-chromadb
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      - CHROMA_DB_IMPL=duckdb+parquet
      - PERSIST_DIRECTORY=/chroma/chroma
    networks:
      - looma-net

  # ============================================
  # Redis (overseas: rate limiting + cache)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: looma-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - looma-net

  # ============================================
  # PostgreSQL 17 + pgvector（联邦登记 / 目录真源）
  # 2026-09-28 重建，取代 2026-07-02 手工 docker run 的孤儿容器。
  # 三条硬约束（对应 PROD_PG_REBUILD_PLAN.md §2 根因，改之前先读）：
  #   1) PGDATA 用 named volume —— 绝不能落仓库树内（deploy.yml 的 rsync --delete
  #      会删掉 data/pgdata，这正是上次死亡原因 R1）
  #   2) ports 只绑 127.0.0.1 —— 消除 0.0.0.0:5433 公网暴露（R4）
  #   3) 密码只从 docker/.env 取（env_file），不入 git；.env 已被 rsync 排除
  # 注意：deploy.yml 的 `compose down -p looma-zervi` 会重建本容器，数据在
  # named volume 里不受影响；故 up 列表（deploy.yml:371）必须含 pgvector。
  # ============================================
  pgvector:
    image: pgvector/pgvector:pg17
    container_name: looma-pgvector
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      - POSTGRES_USER=looma
      - POSTGRES_DB=genzltd
    env_file:
      - ./.env          # docker/.env：提供 POSTGRES_PASSWORD（缺文件 → compose 报错，快速失败）
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U looma -d genzltd"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - looma-net

volumes:
  backend-data:
  chroma-data:
  redis-data:
  pgdata:

networks:
  looma-net:
    driver: bridge
