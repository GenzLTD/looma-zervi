events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    # ============================================
    # Upstream: Flask backend (Docker port mapped to host)
    # ============================================
    upstream looma_backend {
        server 127.0.0.1:5200;
    }

    # ============================================
    # Rate limiting zones
    # ============================================
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=2r/s;

    # ============================================
    # HTTP: per-host routing (Cloudflare Flexible → port 80)
    # ============================================

    # api.genz.ltd — API only (no static SPA fallback)
    server {
        listen 80;
        server_name api.genz.ltd;

        location /v1/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://looma_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /v1/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://looma_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_read_timeout 120s;
        }

        location /health {
            proxy_pass http://looma_backend/health;
            access_log off;
        }

        location / {
            default_type application/json;
            return 404 '{"error":"not_found","message":"Use /v1/ endpoints"}';
        }
    }

    # genz.ltd / www.genz.ltd — 已迁出本机（2026-09-18）
    #
    # 裸域营销站真源 = 独立仓 GenzLTD/genz-web → Vercel 自动部署，**不在本机 serve**。
    # 此前这里挂的是 (VPS fallback if not on Vercel)，属错链：一旦 DNS 被指回本机，
    # ICP 已删的旧营销壳会复活。不要恢复本块，也不要重新引入 /var/www/genz-web 投递。
    # 详见 docs/MULTI_REPO_PUBLISH_FEDERATION.md
    #
    # 实测（摘块安全门禁）：scripts/cutover-test/ — 摘块后 api /health 200、
    # /v1/payment/webhook/stripe 200 路径仍在、tspace 200、裸域 404 Unknown host。

    # tspace.genz.ltd — B2B SPA + API proxy
    server {
        listen 80;
        server_name tspace.genz.ltd;

        location /v1/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://looma_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            root /var/www/saas/dist;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }

    # Catch-all: reject unknown hosts on port 80
    server {
        listen 80 default_server;
        server_name _;

        location / {
            default_type application/json;
            return 404 '{"error":"not_found","message":"Unknown host"}';
        }
    }

    # ============================================
    # HTTPS: genz.ltd + www — 已迁出（2026-09-18）
    # ============================================
    #
    # 与上面 HTTP 段同源：裸域营销站由 GenzLTD/genz-web → Vercel 承接，本机不再
    # 监听该 Host 的 443，也不再从 /var/www/genz-web 读文件。
    #
    # 注意：本机保留的 ssl_certificate 仅供 api / tspace 使用；裸域证书由 Vercel 终结。

    # ============================================
    # HTTPS: api.genz.ltd — pure API
    # ============================================
    server {
        listen 443 ssl http2;
        server_name api.genz.ltd;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        location /v1/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://looma_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /v1/payment/wechat/notify {
            # WeChat Pay webhooks: no rate limit
            proxy_pass http://looma_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /v1/payment/webhook/ {
            # Unified webhook receiver (Stripe / PayPal / Airwallex): no rate limit
            proxy_pass http://looma_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Backward compat: legacy Stripe webhook path
        location /v1/payment/stripe/webhook {
            proxy_pass http://looma_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location /v1/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://looma_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_read_timeout 120s;
        }

        location /health {
            proxy_pass http://looma_backend/health;
            access_log off;
        }

        location / {
            default_type application/json;
            return 404 '{"error":"not_found","message":"Use /v1/ endpoints"}';
        }
    }

    # ============================================
    # HTTPS: tspace.genz.ltd — T-space B2B SaaS SPA
    # ============================================
    server {
        listen 443 ssl http2;
        server_name tspace.genz.ltd;

        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        # T-space SPA
        location / {
            root /var/www/saas/dist;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # T-space API proxy
        location /v1/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://looma_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 120s;
            proxy_buffering off;
        }
    }
}
