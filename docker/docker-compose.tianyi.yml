# 天翼云中央机 overlay — 不改腾讯云默认 compose。
# 用法（在 /opt/looma-zervi/docker）:
#   docker compose -p looma-zervi -f docker-compose.yml -f docker-compose.tianyi.yml up -d
#
# 效果：5200 只绑回环；chroma/redis 不映射宿主；backend 可经 host.docker.internal 打到宿主机 :5211。

services:
  backend:
    ports:
      - "127.0.0.1:5200:5200"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  chromadb:
    ports: []

  redis:
    ports: []
