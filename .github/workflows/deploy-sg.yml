# ============================================================
# Deploy SG — overseas track (tag -> Singapore Vultr only)
#
# Dual-track (2026-11):
#   mainland = main -> deploy.yml -> Tianyi
#   overseas = stack-v* tag / workflow_dispatch -> this file
#
# Do NOT rsync from this repo to 139.180.184.25:
#   old deploy-overseas.yml retired (785c2a7 / ad85e44); looma main
#   --delete would wipe overseas membership/account blueprints.
#   Overseas source of truth = GenzLTD/Vultr-Genzltd deploy.yml (stack-v*).
#
# Strategy (reuse Vultr workflow, no second fragile SSH path):
#   1. fail-fast auth (no silent no-auth)
#   2. workflow_dispatch Vultr Deploy stack via GitHub API
#   3. default dry_run=true; live needs dry_run=false AND vars.SG_DISPATCH_LIVE=true
#
# Preferred production path (no cross-repo PAT):
#   On Vultr-Genzltd: git tag stack-vX.Y.Z && git push origin stack-vX.Y.Z
#   -> that repo deploys vars.DEPLOY_HOST (139.180.184.25 / api.genz.ltd)
#
# Secrets (looma-zervi, isolated from TIANYI_*):
#   VULTR_DEPLOY_DISPATCH_TOKEN — fine-grained PAT:
#       owner=GenzLTD, repo=Vultr-Genzltd, Actions=write, Contents=read
#
# Variables (optional):
#   SG_DISPATCH_LIVE — must be string true to allow dry_run=false
#   VULTR_DEPLOY_WORKFLOW_FILE — default deploy.yml
#   VULTR_DEPLOY_OWNER_REPO — default GenzLTD/Vultr-Genzltd
#
# Forbidden:
#   - SSH_HOST / SSH_USER / SSH_PRIVATE_KEY (retired Tencent host)
#   - this job must not push Tianyi or Frankfurt
# ============================================================
name: Deploy SG

on:
  push:
    tags:
      - 'stack-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true: validate + Vultr dry_run gates. false: request live SG (needs SG_DISPATCH_LIVE=true).'
        type: boolean
        default: true
      vultr_ref:
        description: 'Vultr-Genzltd ref (branch or existing stack-v* tag). Default main.'
        type: string
        default: 'main'

permissions:
  contents: read

concurrency:
  group: deploy-sg-dispatch
  cancel-in-progress: false

env:
  VULTR_REPO: ${{ vars.VULTR_DEPLOY_OWNER_REPO != '' && vars.VULTR_DEPLOY_OWNER_REPO || 'GenzLTD/Vultr-Genzltd' }}
  VULTR_WORKFLOW: ${{ vars.VULTR_DEPLOY_WORKFLOW_FILE != '' && vars.VULTR_DEPLOY_WORKFLOW_FILE || 'deploy.yml' }}

jobs:
  require-config:
    name: Fail-fast config
    runs-on: ubuntu-latest
    outputs:
      dry_run: ${{ steps.decide.outputs.dry_run }}
      vultr_ref: ${{ steps.decide.outputs.vultr_ref }}
      live: ${{ steps.decide.outputs.live }}
    steps:
      - name: Decide dry_run / ref
        id: decide
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DR="${{ inputs.dry_run }}"
            REF="${{ inputs.vultr_ref }}"
          else
            # tag push defaults to dry_run only — avoid looma tag hitting api.genz.ltd
            DR="true"
            REF="main"
          fi
          [ -n "$REF" ] || REF="main"
          LIVE="false"
          if [ "$DR" = "false" ] && [ "${{ vars.SG_DISPATCH_LIVE }}" = "true" ]; then
            LIVE="true"
          fi
          if [ "$DR" = "false" ] && [ "$LIVE" != "true" ]; then
            echo "::error::dry_run=false but vars.SG_DISPATCH_LIVE is not true — refuse live. Prefer tagging Vultr-Genzltd, or set SG_DISPATCH_LIVE=true."
            exit 1
          fi
          echo "dry_run=$DR" >> "$GITHUB_OUTPUT"
          echo "vultr_ref=$REF" >> "$GITHUB_OUTPUT"
          echo "live=$LIVE" >> "$GITHUB_OUTPUT"
          echo "event=${{ github.event_name }} ref=${{ github.ref_name }} -> Vultr dry_run=$DR live=$LIVE vultr_ref=$REF"

      - name: Require dispatch token (no silent no-auth)
        env:
          TOKEN: ${{ secrets.VULTR_DEPLOY_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::missing secrets.VULTR_DEPLOY_DISPATCH_TOKEN."
            echo "Set fine-grained PAT (owner=GenzLTD, Vultr-Genzltd only, Actions: write, Contents: read),"
            echo "or use canonical path: push stack-v* on Vultr-Genzltd (vars.DEPLOY_HOST=139.180.184.25)."
            echo "Do not use SSH_HOST/SSH_USER/SSH_PRIVATE_KEY (Tencent 1.14.202.161 decommissioned)."
            exit 1
          fi
          code="$(curl -sS -o /tmp/vultr-repo.json -D /tmp/vultr-repo.hdr -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ env.VULTR_REPO }}" || true)"
          code="${code:-000}"
          echo "GET /repos/${{ env.VULTR_REPO }} -> HTTP $code"
          case "$code" in
            200) echo "token can read Vultr repo" ;;
            401)
              echo "::error::HTTP 401: VULTR_DEPLOY_DISPATCH_TOKEN invalid or revoked"
              exit 1
              ;;
            403)
              echo "::error::HTTP 403: token rejected (SSO / Actions permission)"
              exit 1
              ;;
            404)
              echo "::error::HTTP 404: token cannot see ${{ env.VULTR_REPO }}"
              exit 1
              ;;
            *)
              echo "::error::HTTP $code unexpected"
              head -c 400 /tmp/vultr-repo.json || true
              exit 1
              ;;
          esac

      - name: Refuse confused mainland secrets as SG target
        env:
          LEGACY_HOST: ${{ secrets.SSH_HOST }}
          TIANYI_HOST: ${{ secrets.TIANYI_SSH_HOST }}
        run: |
          set -euo pipefail
          echo "Overseas track does not use SSH_HOST (retired Tencent) or TIANYI_*."
          echo "Canonical SSH target lives in Vultr repo: vars.DEPLOY_HOST=139.180.184.25 (api.genz.ltd origin)."
          if [ -n "${LEGACY_HOST:-}" ]; then
            echo "note: SSH_HOST still set in this repo — rotate/delete; do not use for SG."
          fi
          if [ "${TIANYI_HOST:-}" = "139.180.184.25" ]; then
            echo "::error::TIANYI_SSH_HOST points at Singapore — secret crosstalk"
            exit 1
          fi

  dispatch-vultr:
    name: Dispatch Vultr Deploy stack
    runs-on: ubuntu-latest
    needs: [require-config]
    steps:
      - name: workflow_dispatch to Vultr-Genzltd
        env:
          TOKEN: ${{ secrets.VULTR_DEPLOY_DISPATCH_TOKEN }}
          DRY: ${{ needs.require-config.outputs.dry_run }}
          LIVE: ${{ needs.require-config.outputs.live }}
          REF: ${{ needs.require-config.outputs.vultr_ref }}
        run: |
          set -euo pipefail
          if [ "$LIVE" = "true" ]; then
            DRY_JSON=false
            echo "=== LIVE dispatch: Vultr will deploy to vars.DEPLOY_HOST (SG) ==="
          else
            DRY_JSON=true
            echo "=== dry_run dispatch: Vultr gates only, no SSH to SG ==="
          fi
          body="$(printf '{"ref":"%s","inputs":{"dry_run":%s}}' "$REF" "$DRY_JSON")"
          echo "POST workflows/${{ env.VULTR_WORKFLOW }}/dispatches ref=$REF dry_run=$DRY_JSON"
          code="$(curl -sS -o /tmp/dispatch.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d "$body" \
            "https://api.github.com/repos/${{ env.VULTR_REPO }}/actions/workflows/${{ env.VULTR_WORKFLOW }}/dispatches" || true)"
          code="${code:-000}"
          echo "dispatch HTTP $code"
          if [ "$code" != "204" ]; then
            echo "::error::dispatch failed HTTP $code"
            cat /tmp/dispatch.json || true
            exit 1
          fi
          echo "Dispatched. Track: https://github.com/${{ env.VULTR_REPO }}/actions/workflows/${{ env.VULTR_WORKFLOW }}"
          echo "Preferred production: push stack-v* on Vultr-Genzltd directly (no PAT needed)."
