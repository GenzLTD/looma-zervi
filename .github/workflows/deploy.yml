# ============================================================
# Deploy — 大陆轨已停用（main → 仅 CI，不部署任何主机）
#
# 2026-11-07 裁决：天翼云 14.29.216.219 属「旧三 IP 禁跑清单」，
#   本 workflow 不得再指向天翼 / 退役腾讯 1.14.202.161 / 新加坡。
#   main push 只跑 backend-test；恢复自动部署须待新机参数齐并另行授权。
#
# 双轨现状：
#   mainland = push main / workflow_dispatch → 本文件 → 仅 Backend Tests
#   overseas = tag stack-v* → deploy-sg.yml（派发 GenzLTD/Vultr-Genzltd
#              Deploy stack，不在本仓 SSH 任何主机）
#
# 已退役 / 禁止：
#   - Deploy to Tianyi（14.29.216.219）— 2026-11-07 移除，禁跑清单
#   - Deploy to Server（腾讯云 1.14.202.161）— 主机已下线
#   - deploy-overseas.yml — 本仓代码同步会盖掉海外会员蓝图
#   - 不再读取任何主机 SSH / 天翼专用 Secrets
#
# 不在此 workflow 部署：
#   - genz.ltd 营销站 → genz-web + Vercel
#   - Bolent 企业站   → 独立部署
#   - 海外 Vultr SG   → deploy-sg.yml（tag stack-v*）
#   - 法兰克福演练机  → 独立 staging-frankfurt 脚本，不走 main push
#
# 恢复自动部署的前置：新机 IP / SSH / SG 规则 / 健康检查 URL / 预发域名 /
#   Python 版本 / 密钥注入方式齐备 + 生产 SECRET_KEY / JWT_SECRET 注入 +
#   本地 dry-run 通过。详见 thomas-verification-chain-2026-11-06.md §16。
# ============================================================
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.sync-config.json'
      - 'scripts/sync-remotes.sh'
  workflow_dispatch:

concurrency:
  group: deploy-ci
  cancel-in-progress: false

jobs:
  backend-test:
    name: "Backend Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_PATH: ":memory:"
          JWT_SECRET: ci-test-secret
          WECHAT_DEV_MODE: "true"
          WECHAT_APPID: test_appid
          WECHAT_SECRET: test_secret
          DEEPSEEK_API_KEY: skip
          DEEPSEEK_BASE_URL: https://api.deepseek.com/v1
          CHROMA_PERSIST_DIR: /tmp/chroma_ci
        run: python -m pytest tests/ -v --tb=short
