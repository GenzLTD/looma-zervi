# QCC MCP China gateway — LOCAL ServBay edition (custom port :8998)
#
# 背景（2026-08-27 拍板）：腾讯 1.14.202.161:8998 网关退役（唯一消费者海外 qcc 已弃用），
# 本地开发用 ServBay 自定义端口 :8998 承接同款端点。
#
# 与腾讯版 qcc-gateway.conf 的差异：
#   1. 只监听回环 127.0.0.1（本地天然只有本机可访问，无需 geo 白名单）
#   2. 反代目标不变：agent.qcc.com/mcp/ + /messages/（QCC streamable HTTP）
#   3. 保留 /health 供存活检查
#
# ServBay 接入方式（二选一）：
#   A. ServBay 面板 → 新建站点 → 自定义端口 8998（NGINX 引擎）→ 粘贴本文件内容；
#   B. 直接用本机 nginx 加载：把本文件放进 nginx sites-enabled 后 reload。
#
# 用法：
#   QCC_MCP_BASE_URL=http://127.0.0.1:8998/mcp   # 本地 looma 开发环境
#
# 注意：MCP 是 Streamable HTTP（POST JSON-RPC 到 /mcp/*/stream，GET 返回 405），
#   /mcp/ 与 /messages/ 都必须转发 Content-Type: application/json。

server {
    listen 127.0.0.1:8998;
    server_name _;

    client_max_body_size 4m;

    location /mcp/ {
        proxy_pass https://agent.qcc.com/mcp/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name agent.qcc.com;
        proxy_pass_request_headers off;
        proxy_set_header Host agent.qcc.com;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Accept $http_accept;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header User-Agent "looma-qcc-gateway-local/1.0";
        proxy_set_header Mcp-Session-Id $http_mcp_session_id;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    location /messages/ {
        proxy_pass https://agent.qcc.com/messages/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name agent.qcc.com;
        proxy_pass_request_headers off;
        proxy_set_header Host agent.qcc.com;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Accept $http_accept;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header User-Agent "looma-qcc-gateway-local/1.0";
        proxy_set_header Mcp-Session-Id $http_mcp_session_id;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"qcc-gateway-local"}';
    }
}
