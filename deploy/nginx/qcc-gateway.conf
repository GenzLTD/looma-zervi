# QCC MCP China gateway — reverse-proxy to agent.qcc.com
#
# Overseas Looma (SG): QCC_MCP_BASE_URL=http://<CN_HOST>:8998/mcp
#
# Protocol note: QCC now uses streamable HTTP — POST JSON-RPC to /mcp/*/stream
# (GET returns 405「请求方式异常»). Both /mcp/ and /messages/ must forward
# Content-Type: application/json.
#
# Access: only Vultr SG egress + localhost (health/ops).

geo $qcc_gw_allowed {
    default        0;
    127.0.0.1      1;
    ::1            1;
    139.180.184.25 1;  # Vultr SG overseas
}

server {
    listen 8998;
    listen [::]:8998;
    server_name _;

    client_max_body_size 4m;

    # Reject non-allowlisted clients early
    if ($qcc_gw_allowed = 0) {
        return 403;
    }

    location /mcp/ {
        proxy_pass https://agent.qcc.com/mcp/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name agent.qcc.com;
        proxy_pass_request_headers off;
        proxy_set_header Host agent.qcc.com;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Accept $http_accept;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header User-Agent "looma-qcc-gateway/1.0";
        proxy_set_header Mcp-Session-Id $http_mcp_session_id;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    location /messages/ {
        proxy_pass https://agent.qcc.com/messages/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name agent.qcc.com;
        proxy_pass_request_headers off;
        proxy_set_header Host agent.qcc.com;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Accept $http_accept;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header User-Agent "looma-qcc-gateway/1.0";
        proxy_set_header Mcp-Session-Id $http_mcp_session_id;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"qcc-gateway"}';
    }
}
