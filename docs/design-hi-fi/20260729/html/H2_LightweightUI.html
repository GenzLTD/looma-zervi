<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>H2 · 鸿蒙元服务 免安装体验</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root{--hm:#007DFF;--brand:#FF6B35;--t1:#182431;--t2:#99A2B1;--card:#F7F8FA}
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;font-family:'Noto Sans SC',sans-serif;background:#fff;color:var(--t1)}
.phone{width:390px;height:844px;padding:0 16px 34px;display:flex;flex-direction:column}
.status{height:44px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 8px 6px;font-size:14px;font-weight:600}
.xiaoyi{margin-top:8px;height:56px;border-radius:16px;background:var(--card);display:flex;align-items:center;gap:10px;padding:0 14px}
.xiaoyi .av{width:32px;height:32px;border-radius:50%;background:var(--hm);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.xiaoyi .mid{flex:1}
.xiaoyi .mid .a{font-size:12px;color:var(--hm);font-weight:600}
.xiaoyi .mid .b{font-size:13px;font-weight:500}
.quiz{flex:1;margin-top:16px;background:#fff;border:1px solid #EEF1F5;border-radius:16px;padding:18px;box-shadow:0 4px 16px rgba(24,36,49,.05)}
.brand{display:flex;align-items:center;gap:8px;margin-bottom:18px}
.px{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--brand),#8B5CF6);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.tag{font-size:11px;background:#FFF1EA;color:var(--brand);padding:2px 8px;border-radius:999px;font-weight:600}
.qno{font-size:12px;color:var(--t2);margin-bottom:8px}
.q{font-size:16px;font-weight:700;line-height:1.5;margin-bottom:16px}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{height:56px;border-radius:12px;border:1px solid #E8ECF2;background:#fff;display:flex;align-items:center;padding:0 14px;font-size:14px;gap:10px}
.opt.on{border-color:var(--brand);background:#FFF7F3}
.opt .k{width:22px;height:22px;border-radius:50%;border:1px solid #D5DBE5;display:grid;place-items:center;font-size:11px;color:var(--t2)}
.opt.on .k{background:var(--brand);border-color:var(--brand);color:#fff}
.opt .check{margin-left:auto;color:var(--brand);font-weight:700;opacity:0}
.opt.on .check{opacity:1}
.foot{margin-top:18px;display:flex;align-items:center;gap:12px}
.prog{flex:1;height:6px;background:#E8ECF2;border-radius:99px;overflow:hidden}
.prog i{display:block;width:20%;height:100%;background:var(--hm)}
.next{background:var(--hm);color:#fff;border:none;border-radius:24px;padding:10px 20px;font-size:14px;font-weight:600}
.info{margin-top:14px;background:var(--card);border-radius:16px;padding:14px;display:grid;grid-template-columns:28px 1fr;gap:10px}
.info .ico{font-size:18px}
.info h3{font-size:14px;font-weight:600;margin-bottom:4px}
.info p{font-size:12px;color:var(--t2);line-height:1.5}
.note{margin-top:10px;text-align:center;font-size:11px;color:var(--t2)}
</style>
</head>
<body>
<div class="phone">
  <div class="status"><span>9:41</span><span>▮▮▮ ▾ 🔋</span></div>
  <div class="xiaoyi">
    <div class="av">艺</div>
    <div class="mid"><div class="a">小艺建议</div><div class="b">PlanetX · 星际人格快测</div></div>
    <span style="color:var(--t2)">›</span>
  </div>
  <div class="quiz">
    <div class="brand"><div class="px">PX</div><strong>PlanetX</strong><span class="tag">免安装体验</span></div>
    <div class="qno">Q1/5</div>
    <div class="q">当你面对一个全新的挑战时，你的第一反应是？</div>
    <div class="opts">
      <div class="opt"><span class="k">A</span>立即制定详细计划<span class="check">✓</span></div>
      <div class="opt on"><span class="k">B</span>先调研再行动<span class="check">✓</span></div>
      <div class="opt"><span class="k">C</span>凭直觉快速尝试<span class="check">✓</span></div>
      <div class="opt"><span class="k">D</span>找人讨论后再决定<span class="check">✓</span></div>
    </div>
    <div class="foot"><div class="prog"><i></i></div><button class="next">下一题</button></div>
  </div>
  <div class="info">
    <div class="ico">⚡</div>
    <div>
      <h3>无需安装，即用即走</h3>
      <p>通过鸿蒙元服务，3秒启动，数据自动同步到 PlanetX 完整版</p>
    </div>
  </div>
  <div class="note">体验数据将在打开 PlanetX 后自动同步</div>
</div>
</body>
</html>
