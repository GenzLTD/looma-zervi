<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>P2 · PlanetX 测试结果</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
:root{--bg:#0A0E27;--card:#131A3A;--o:#FF6B35;--p:#8B5CF6;--c:#00D4FF;--t2:#A0AEC0}
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;font-family:'Noto Sans SC',sans-serif;background:linear-gradient(160deg,#0A0E27,#1C2550 55%,#131A3A);color:#fff}
.phone{width:390px;height:844px;padding:0 16px;position:relative}
.status{height:44px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 8px 6px;font-size:14px;font-weight:600}
.top{height:48px;display:flex;align-items:center;justify-content:space-between}
.top .title{font-size:16px;font-weight:500}
.hero{text-align:center;padding:12px 0 8px}
.planet{width:110px;height:110px;margin:0 auto 14px;position:relative}
.planet .core{width:72px;height:72px;border-radius:50%;position:absolute;inset:19px;background:radial-gradient(circle at 35% 30%,#ffb089,#FF6B35 45%,#8B5CF6);box-shadow:0 0 28px rgba(255,107,53,.55)}
.planet .ring{position:absolute;inset:8px;border:2px solid rgba(0,212,255,.45);border-radius:50%;transform:rotateX(68deg)}
.planet .orbit{position:absolute;inset:0;border:1.5px dashed rgba(139,92,246,.5);border-radius:50%}
.hero h1{font-size:22px;font-weight:700;margin-bottom:6px}
.code{font-family:Orbitron,monospace;color:var(--o);font-size:16px;margin-bottom:8px}
.desc{font-size:13px;color:var(--t2);line-height:1.5;padding:0 12px}
.radar-wrap{margin:16px auto 8px;width:220px;height:200px;position:relative}
.radar-wrap svg{width:100%;height:100%}
.labels{position:absolute;inset:0;pointer-events:none;font-size:10px;color:var(--t2)}
.labels span{position:absolute;transform:translate(-50%,-50%)}
.jobs{margin-top:8px}
.jobs h2{font-size:14px;font-weight:500;margin-bottom:10px}
.job-row{display:flex;gap:8px;overflow:hidden}
.job{min-width:140px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px}
.job .n{font-size:13px;font-weight:500;margin-bottom:6px}
.job .m{font-size:11px;color:var(--o);margin-bottom:6px}
.bar{height:5px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--o),var(--p))}
.job a{display:block;margin-top:8px;font-size:11px;color:var(--c);text-decoration:none}
.share{margin-top:14px;background:rgba(255,255,255,.06);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:14px;display:grid;grid-template-columns:72px 1fr;gap:12px}
.qr{width:72px;height:72px;background:#fff;border-radius:8px;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);gap:2px;padding:6px}
.qr b{background:#111;border-radius:1px}
.qr b.off{background:transparent}
.share h3{font-size:13px;margin-bottom:4px}
.share p{font-size:11px;color:var(--t2);margin-bottom:10px}
.share-btns{display:flex;gap:10px;font-size:18px}
</style>
</head>
<body>
<div class="phone">
  <div class="status"><span>09:41</span><span>▮▮▮ ▾ 🔋</span></div>
  <div class="top"><span>‹</span><span class="title">测试结果</span><span>⇧</span></div>
  <div class="hero">
    <div class="planet"><div class="orbit"></div><div class="ring"></div><div class="core"></div></div>
    <h1>星际探索者 · Pioneer</h1>
    <div class="code">PI-2847</div>
    <p class="desc">你天生渴望未知，在不确定性中找到方向是你的超能力</p>
  </div>
  <div class="radar-wrap">
    <svg viewBox="0 0 200 200">
      <polygon points="100,20 176,75 147,160 53,160 24,75" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="1"/>
      <polygon points="100,40 155,80 135,140 65,140 45,80" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="1"/>
      <polygon points="100,60 134,85 123,120 77,120 66,85" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="1"/>
      <line x1="100" y1="100" x2="100" y2="20" stroke="rgba(255,255,255,.15)"/>
      <line x1="100" y1="100" x2="176" y2="75" stroke="rgba(255,255,255,.15)"/>
      <line x1="100" y1="100" x2="147" y2="160" stroke="rgba(255,255,255,.15)"/>
      <line x1="100" y1="100" x2="53" y2="160" stroke="rgba(255,255,255,.15)"/>
      <line x1="100" y1="100" x2="24" y2="75" stroke="rgba(255,255,255,.15)"/>
      <polygon points="100,26 160,82 130,145 68,140 40,85" fill="rgba(139,92,246,.35)" stroke="#8B5CF6" stroke-width="2"/>
    </svg>
    <div class="labels">
      <span style="left:50%;top:6%">探索力 92</span>
      <span style="left:92%;top:38%">分析力 78</span>
      <span style="left:78%;top:88%">协作力 65</span>
      <span style="left:22%;top:88%">执行力 70</span>
      <span style="left:8%;top:38%">创新力 88</span>
    </div>
  </div>
  <div class="jobs">
    <h2>为你推荐的星际职业</h2>
    <div class="job-row">
      <div class="job"><div class="n">🧭 产品经理</div><div class="m">匹配度 95%</div><div class="bar"><i style="width:95%"></i></div><a>了解 ›</a></div>
      <div class="job"><div class="n">📈 增长策略师</div><div class="m">匹配度 87%</div><div class="bar"><i style="width:87%"></i></div><a>了解 ›</a></div>
      <div class="job"><div class="n">🎨 UX 设计师</div><div class="m">匹配度 82%</div><div class="bar"><i style="width:82%"></i></div><a>了解 ›</a></div>
    </div>
  </div>
  <div class="share">
    <div class="qr">
      <b></b><b class="off"></b><b></b><b class="off"></b><b></b>
      <b></b><b></b><b class="off"></b><b></b><b></b>
      <b class="off"></b><b></b><b></b><b></b><b class="off"></b>
      <b></b><b class="off"></b><b></b><b class="off"></b><b></b>
      <b></b><b></b><b class="off"></b><b></b><b></b>
    </div>
    <div>
      <h3>扫码查看我的星际人格</h3>
      <p>已有 23 位好友解锁</p>
      <div class="share-btns"><span>💬</span><span>🟢</span><span>🔗</span></div>
    </div>
  </div>
</div>
</body>
</html>
